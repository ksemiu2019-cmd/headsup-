<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heads Up! Pop Culture + Sports</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;overflow:hidden}.app{width:min(680px,100%);height:min(100svh,900px);max-height:100svh;background:#1c1c1e;border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-sizing:border-box;overflow:auto}h1{font-size:42px;margin:0 0 8px}.sub,.small{color:#aaa}.setup-card{margin:20px 0;text-align:left}.setup-card label{display:block;font-weight:800;margin:14px 0 7px}input,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #444;background:#29292b;color:#fff;border-radius:12px;font-size:17px}.names{display:grid;gap:10px}.categories{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{display:flex;align-items:center;gap:8px;background:#29292b;padding:11px;border-radius:12px;cursor:pointer}.cat input{width:auto;margin:0}.cat.all{grid-column:1/-1}.stats{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.turn{font-size:19px;font-weight:800;margin:8px 0 18px}.scoreboard{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}.teamscore{background:#29292b;border-radius:12px;padding:9px 12px;min-width:90px}.teamscore.active{outline:2px solid #fff}.teamscore b{display:block;font-size:22px}.progress{color:#aaa;margin-bottom:10px}.word{font-size:clamp(42px,11vw,82px);font-weight:900;line-height:1.02;min-height:170px;display:flex;align-items:center;justify-content:center}.category{color:#aaa;margin-bottom:22px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:18px;min-height:64px;font-size:20px;font-weight:800;cursor:pointer}.pass{background:#333;color:#fff}.correct,.start{background:#fff;color:#111}.start{width:100%}.hidden{display:none}.score{font-size:76px;font-weight:900}.final-board{display:grid;gap:10px;margin:20px 0}.final-row{display:flex;justify-content:space-between;align-items:center;background:#29292b;padding:14px 16px;border-radius:14px;font-size:20px}.final-row b{font-size:28px}@media(max-width:600px){.app{width:100%;height:100svh;max-height:none;border-radius:0;padding:clamp(16px,5vw,24px)}h1{font-size:clamp(32px,9vw,42px)}.word{min-height:clamp(150px,34svh,300px);font-size:clamp(40px,12vw,72px)}button{min-height:58px}.setup-card{margin:12px 0}.stats{font-size:14px}}
@media(orientation:landscape){html,body{height:100%;min-height:100%;overflow:hidden}.app{width:100%;height:100svh;min-height:100svh;max-height:none;border-radius:0;padding:10px max(18px,env(safe-area-inset-left)) 10px max(18px,env(safe-area-inset-right));justify-content:flex-start;overflow:hidden}.app>*{min-height:0}.stats{margin-bottom:4px;font-size:14px;flex:0 0 auto}.turn{font-size:17px;margin:3px 0 5px;flex:0 0 auto}.scoreboard{margin-bottom:5px;padding-bottom:2px;flex:0 0 auto}.teamscore{padding:5px 10px;min-width:72px}.teamscore b{font-size:18px}.word{min-height:0;height:calc(100svh - 190px);max-height:45svh;font-size:clamp(34px,7vw,64px);flex:1 1 auto}.category{margin:3px 0 6px;flex:0 0 auto}.buttons{flex:0 0 auto}.buttons button{min-height:48px;height:clamp(48px,9svh,64px)}#game{height:100%;display:flex;flex-direction:column}.setup-card{margin:5px 0}.setup-card label{margin:5px 0 3px}.setup-card input,.setup-card select{padding:9px;font-size:15px}.setup-card .categories{gap:5px}.cat{padding:7px}.start{min-height:48px}}
@media (orientation:portrait){.app{width:100%;}}
</style>
</head>
<body>
<main class="app">
<section id="setup">
<h1>Heads Up! 🎉</h1><p class="sub">Movies • Actors • Music • Sports • Cars • Countries • Pop Culture</p>
<div class="setup-card">
<label for="teamCount">Players / teams</label>
<select id="teamCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
<label for="questionsPerTeam">Questions per player / team</label>
<select id="questionsPerTeam"><option value="5">5 questions</option><option value="10">10 questions</option></select>
<label for="timeLimit">Turn time</label><select id="timeLimit"><option value="30">30 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option><option value="120">2 minutes</option><option value="custom">Custom</option></select><input id="customTime" type="number" min="5" max="300" value="45" placeholder="Custom seconds" style="display:none"><label>Categories</label><div class="categories" id="categories">
<label class="cat all"><input type="checkbox" id="selectAllCats" checked> <span>All categories</span></label>
<label class="cat"><input type="checkbox" class="catCheck" value="Movies" checked> <span>Movies</span></label>
<label class="cat"><input type="checkbox" class="catCheck" value="Actors" checked> <span>Actors</span></label>
<label class="cat"><input type="checkbox" class="catCheck" value="Music" checked> <span>Music</span></label>
<label class="cat"><input type="checkbox" class="catCheck" value="Sports" checked> <span>Sports</span></label>
<label class="cat"><input type="checkbox" class="catCheck" value="Cars" checked> <span>Cars</span></label>
<label class="cat"><input type="checkbox" class="catCheck" value="Countries" checked> <span>Countries</span></label>
<label class="cat"><input type="checkbox" class="catCheck" value="Pop Culture" checked> <span>Pop Culture</span></label>
</div><label>Names</label><div class="names" id="names"></div>
</div>
<button class="start" id="start">Start Game</button>
<p class="small">Choose your turn time above. Correct or Pass moves to the next question. After the selected number of questions, the next player/team takes their turn.</p>
</section>
<section id="game" class="hidden">
<div class="stats"><span>Time: <b id="time">60</b>s</span><button id="sound" type="button" style="min-height:44px;padding:8px 12px;font-size:16px;background:#29292b;color:#fff">🔊 Sound On</button><span>Question: <b id="questionNum">1</b>/<b id="questionTotal">5</b></span></div>
<div class="turn" id="turn"></div>
<div class="scoreboard" id="scoreboard"></div>
<div class="word" id="word"></div><div class="category" id="category"></div>
<div class="buttons"><button class="pass" id="pass">↩ Pass</button><button class="correct" id="correct">✓ Correct</button></div>
</section>
<section id="results" class="hidden">
<p class="small">GAME OVER!</p><h2>Final Scores</h2><div class="final-board" id="finalBoard"></div>
<button class="start" id="again">Play Again</button>
</section>
</main>
<script>
const cards=[
['Sinners','Movies'],['F1: The Movie','Movies'],['Superman','Movies'],['Wicked: For Good','Movies'],['A Minecraft Movie','Movies'],['Jurassic World: Rebirth','Movies'],['The Fantastic Four: First Steps','Movies'],['How to Train Your Dragon','Movies'],['Avatar: Fire and Ash','Movies'],['Mission: Impossible - The Final Reckoning','Movies'],['Thunderbolts*','Movies'],['Captain America: Brave New World','Movies'],['Final Destination: Bloodlines','Movies'],['Spider-Man: Brand New Day','Movies'],['The Odyssey','Movies'],['Michael','Movies'],['Toy Story 5','Movies'],['The Super Mario Galaxy Movie','Movies'],['The Devil Wears Prada 2','Movies'],
['Tom Holland','Actors'],['Zendaya','Actors'],['Timothée Chalamet','Actors'],['Margot Robbie','Actors'],['Ryan Gosling','Actors'],['Pedro Pascal','Actors'],['Florence Pugh','Actors'],['Michael B. Jordan','Actors'],['Sydney Sweeney','Actors'],['Jenna Ortega','Actors'],['Paul Mescal','Actors'],['Anne Hathaway','Actors'],['Matt Damon','Actors'],['Chris Pratt','Actors'],['Jack Black','Actors'],['Meryl Streep','Actors'],['Emily Blunt','Actors'],['Dwayne Johnson','Actors'],['Ryan Reynolds','Actors'],
['Taylor Swift','Music'],['Drake','Music'],['Beyoncé','Music'],['The Weeknd','Music'],['Rihanna','Music'],['Bad Bunny','Music'],['Sabrina Carpenter','Music'],['Kendrick Lamar','Music'],['Travis Scott','Music'],['Harry Styles','Music'],['Eminem','Music'],['Lady Gaga','Music'],['Justin Bieber','Music'],['Adele','Music'],['Bruno Mars','Music'],['Ariana Grande','Music'],['Doja Cat','Music'],['Tems','Music'],
['LeBron James','Sports'],['Stephen Curry','Sports'],['Serena Williams','Sports'],['Lionel Messi','Sports'],['Cristiano Ronaldo','Sports'],['Kobe Bryant','Sports'],['Simone Biles','Sports'],['Usain Bolt','Sports'],['Michael Jordan','Sports'],['Patrick Mahomes','Sports'],['Shohei Ohtani','Sports'],['Coco Gauff','Sports'],['Tom Brady','Sports'],['Tiger Woods','Sports'],['Luka Dončić','Sports'],['Victor Wembanyama','Sports'],['Naomi Osaka','Sports'],['Novak Djokovic','Sports'],['Jayson Tatum','Sports'],['Giannis Antetokounmpo','Sports'],
['Toyota','Cars'],['Honda','Cars'],['BMW','Cars'],['Mercedes-Benz','Cars'],['Porsche','Cars'],['Ferrari','Cars'],['Lamborghini','Cars'],['Tesla','Cars'],['Range Rover','Cars'],['Lexus','Cars'],['Ford','Cars'],['Chevrolet','Cars'],['Jeep','Cars'],['Acura','Cars'],['Audi','Cars'],['Mustang','Cars'],['G-Wagon','Cars'],['Toyota Supra','Cars'],['Honda Civic','Cars'],['Porsche 911','Cars'],['Land Rover Defender','Cars'],['Tesla Model 3','Cars'],['BMW M3','Cars'],['Mercedes-AMG GT','Cars'],
['Canada','Countries'],['United States','Countries'],['Mexico','Countries'],['Brazil','Countries'],['Argentina','Countries'],['Nigeria','Countries'],['Ghana','Countries'],['South Africa','Countries'],['Egypt','Countries'],['Sudan','Countries'],['Morocco','Countries'],['United Kingdom','Countries'],['France','Countries'],['Spain','Countries'],['Italy','Countries'],['Germany','Countries'],['Portugal','Countries'],['Turkey','Countries'],['Saudi Arabia','Countries'],['United Arab Emirates','Countries'],['India','Countries'],['Pakistan','Countries'],['Japan','Countries'],['South Korea','Countries'],['China','Countries'],['Australia','Countries'],['New Zealand','Countries'],['Jamaica','Countries'],['Kenya','Countries'],['Ethiopia','Countries'],['Iceland','Countries'],['Switzerland','Countries'],['Netherlands','Countries'],['Greece','Countries'],['Norway','Countries'],
['TikTok','Pop Culture'],['Instagram','Pop Culture'],['YouTube','Pop Culture'],['Netflix','Pop Culture'],['Barbie','Pop Culture'],['Hello Kitty','Pop Culture'],['MrBeast','Pop Culture'],['The Kardashians','Pop Culture'],['Met Gala','Pop Culture'],['Coachella','Pop Culture'],['The Bachelor','Pop Culture'],['WWE','Pop Culture'],['Disney','Pop Culture'],['Marvel','Pop Culture'],['Star Wars','Pop Culture'],['Nintendo','Pop Culture'],['Minecraft','Pop Culture'],['Super Bowl','Pop Culture'],['Grammy Awards','Pop Culture'],['Taylor Swift Eras Tour','Pop Culture'],['Wednesday','Pop Culture'],['Stranger Things','Pop Culture'],['Squid Game','Pop Culture']];
const $=x=>document.getElementById(x);let teams=[],current=0,question=0,deck=[],cardIndex=0,time=30,turnDuration=30,timer,selectedCategories=[];
let soundOn=true,audioCtx;
function beep(type){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);let f=700,d=.12;if(type==='correct'){f=880;d=.16;o.frequency.setValueAtTime(660,now);o.frequency.exponentialRampToValueAtTime(1040,now+d)}else if(type==='pass'){f=300;d=.14;o.frequency.setValueAtTime(520,now);o.frequency.exponentialRampToValueAtTime(220,now+d)}else if(type==='start'){f=520;d=.28;o.frequency.setValueAtTime(420,now);o.frequency.exponentialRampToValueAtTime(760,now+d)}else if(type==='time'){f=180;d=.45;o.frequency.setValueAtTime(300,now);o.frequency.exponentialRampToValueAtTime(110,now+d)}g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.18,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.start(now);o.stop(now+d+.02)}catch(e){}}
function setSound(){soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';if(soundOn)beep('correct')}
$('sound').addEventListener('click',setSound);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderNames(){let n=Number($('teamCount').value);$('names').innerHTML='';for(let i=0;i<n;i++){let input=document.createElement('input');input.type='text';input.placeholder=`Player / Team ${i+1}`;input.value=`${i<2?'Team ': 'Player '}${i+1}`;input.dataset.index=i;$('names').appendChild(input)}}
$('teamCount').addEventListener('change',renderNames);renderNames();
const selectAllCats=$('selectAllCats'),catChecks=[...document.querySelectorAll('.catCheck')];
selectAllCats.addEventListener('change',()=>catChecks.forEach(c=>c.checked=selectAllCats.checked));
catChecks.forEach(c=>c.addEventListener('change',()=>selectAllCats.checked=catChecks.every(x=>x.checked)));
function getSelectedCategories(){const chosen=catChecks.filter(c=>c.checked).map(c=>c.value);return chosen.length?chosen:['Movies']}
$('timeLimit').addEventListener('change',()=>{$('customTime').style.display=$('timeLimit').value==='custom'?'block':'none'});
function getTurnDuration(){let v=$('timeLimit').value;if(v==='custom'){let n=Number($('customTime').value);return Math.min(300,Math.max(5,Number.isFinite(n)?n:45))}return Number(v)}
function renderScores(){ $('scoreboard').innerHTML=teams.map((t,i)=>`<div class="teamscore ${i===current?'active':''}"><span>${escapeHtml(t.name)}</span><b>${t.score}</b></div>`).join('') }
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showCard(){if(cardIndex>=deck.length){deck=shuffle(cards.filter(c=>selectedCategories.includes(c[1])));cardIndex=0}$('word').textContent=deck[cardIndex][0];$('category').textContent=deck[cardIndex][1];$('questionNum').textContent=question+1;$('questionTotal').textContent=teams[current].limit}
function resetTimer(){clearInterval(timer);time=turnDuration;$('time').textContent=time;timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0){clearInterval(timer);beep('time');finishTurn()}},1000)}
function start(){beep('start');let inputs=[...document.querySelectorAll('#names input')];turnDuration=getTurnDuration();selectedCategories=getSelectedCategories();teams=inputs.map((x,i)=>({name:x.value.trim()||`Player / Team ${i+1}`,score:0,limit:Number($('questionsPerTeam').value)}));current=0;question=0;deck=shuffle(cards.filter(c=>selectedCategories.includes(c[1])));cardIndex=0;$('setup').classList.add('hidden');$('results').classList.add('hidden');$('game').classList.remove('hidden');$('turn').textContent=`${teams[current].name}'s turn`;renderScores();showCard();resetTimer()}
function finishTurn(){clearInterval(timer);if(current===teams.length-1){endGame();return}current++;question=0;beep('start');$('turn').textContent=`${teams[current].name}'s turn`;renderScores();showCard();resetTimer()}
function answer(correct){beep(correct?'correct':'pass');if(correct)teams[current].score++;question++;cardIndex++;renderScores();if(question>=teams[current].limit){finishTurn()}else{showCard()}}
function endGame(){clearInterval(timer);$('game').classList.add('hidden');$('results').classList.remove('hidden');let sorted=[...teams].sort((a,b)=>b.score-a.score);$('finalBoard').innerHTML=sorted.map(t=>`<div class="final-row"><span>${escapeHtml(t.name)}</span><b>${t.score}</b></div>`).join('')}
$('start').onclick=start;$('again').onclick=()=>{$('results').classList.add('hidden');$('setup').classList.remove('hidden')};$('correct').onclick=()=>answer(true);$('pass').onclick=()=>answer(false);
</script>
</body></html>
